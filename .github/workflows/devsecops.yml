name: DevSecOps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias fixadas e ferramentas
        run: |
          python -m pip install -r rede-alimenta-back/requirements.txt -r ml/requirements-ml.txt bandit pip-audit
          mkdir -p reports
          python --version > reports/versions.txt
          python -m pip freeze >> reports/versions.txt
          echo "$GITHUB_SHA" > reports/commit.txt
      - name: Validar sintaxe
        run: python -m compileall -q rede-alimenta-back ml
      - name: Testes de seguranca da API (autenticacao, rate limit, cabecalhos)
        working-directory: rede-alimenta-back
        run: python -m unittest discover -s tests -v
      - name: Testes do modelo (JSON da API equivale ao pipeline scikit-learn)
        run: python -m unittest discover -s ml/tests -v
      - name: Gerar relatorio completo Bandit (backend e ml)
        run: bandit -r rede-alimenta-back ml -x rede-alimenta-back/tests,rede-alimenta-back/vendor -f json -o reports/bandit.json --exit-zero
      - name: Bloquear achados medios ou altos com confianca media ou alta
        run: bandit -r rede-alimenta-back ml -x rede-alimenta-back/tests,rede-alimenta-back/vendor -ll -ii
      - name: pip-audit - bloquear dependencias com vulnerabilidades conhecidas
        run: |
          pip-audit -r rede-alimenta-back/requirements.txt -f json -o reports/pip-audit-backend.json
          pip-audit -r ml/requirements-ml.txt -f json -o reports/pip-audit-ml.json
      - name: Verificar integridade do Swagger UI vendorizado
        working-directory: rede-alimenta-back/vendor/swagger-ui
        run: sha256sum --check SHA256SUMS
      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sast-${{ github.sha }}
          path: reports/
          if-no-files-found: warn

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Gitleaks - segredos no codigo e em todo o historico
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.0 detect \
            --source /repo --redact --report-format json --report-path /repo/reports/gitleaks.json
      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-${{ github.sha }}
          path: reports/
          if-no-files-found: warn

  container-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validar Compose e construir imagem
        run: |
          printf 'API_TOKEN=%s\n' "$(openssl rand -hex 32)" > rede-alimenta-back/.env
          docker compose config --quiet
          docker build -t alimenta:${{ github.sha }} .
          mkdir -p reports
          docker image inspect alimenta:${{ github.sha }} > reports/image.json
          echo "$GITHUB_SHA" > reports/commit.txt
      - name: Verificar inicializacao, frontend, API docs e autenticacao
        run: |
          TOKEN="$(openssl rand -hex 32)"
          docker run -d --name alimenta-ci -e API_TOKEN="$TOKEN" -p 127.0.0.1:8000:8000 alimenta:${{ github.sha }}
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors \
            --connect-timeout 2 --max-time 5 --retry-max-time 60 \
            http://127.0.0.1:8000/health
          curl --fail http://127.0.0.1:8000/ > /dev/null
          curl --fail http://127.0.0.1:8000/openapi.json > /dev/null
          curl --fail http://127.0.0.1:8000/docs/assets/swagger-ui-bundle.js > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/doadores)" = "401"
          curl -s -D - -o /dev/null http://127.0.0.1:8000/ | grep -i '^content-security-policy:'
      - name: Trivy - misconfiguracao do Dockerfile e Compose
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: json
          output: reports/trivy-config.json
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Trivy - vulnerabilidades, segredos e misconfig da imagem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: alimenta:${{ github.sha }}
          scanners: vuln,secret,misconfig
          format: json
          output: reports/trivy.json
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Guardar logs do container
        if: always()
        run: docker logs alimenta-ci > reports/container.log 2>&1 || true
      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-${{ github.sha }}
          path: reports/
          if-no-files-found: warn
      - name: Encerrar container
        if: always()
        run: docker rm -f alimenta-ci || true
