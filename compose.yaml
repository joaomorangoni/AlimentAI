services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./rede-alimenta-back/.env
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
